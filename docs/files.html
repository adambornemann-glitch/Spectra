<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectra · Module Index</title>
<link rel="stylesheet" href="style.css">
<style>
  .lead { padding: 36px 0 16px; }
  .lead h1 { font-size: clamp(28px,5vw,46px); margin:0 0 8px; letter-spacing:-1px; font-weight:800; }
  .lead p { color:var(--ink-soft); max-width:720px; margin:0; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .ipt { background:var(--panel); border:1px solid var(--stroke-2); border-radius:10px; color:var(--ink);
    padding:10px 14px; font-size:13.5px; font-family:var(--sans); }
  .ipt:focus { outline:none; border-color:var(--violet); }
  #search { width:300px; }
  select.ipt { cursor:pointer; }
  .count { color:var(--ink-faint); font-size:13px; margin-left:auto; font-family:var(--mono); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { position:sticky; top:0; background:rgba(13,16,26,.97); backdrop-filter:blur(8px);
    text-align:left; padding:11px 12px; font-size:11.5px; letter-spacing:.6px; text-transform:uppercase;
    color:var(--ink-faint); cursor:pointer; user-select:none; border-bottom:1px solid var(--stroke-2); white-space:nowrap; }
  thead th:hover { color:var(--ink); }
  thead th .ar { opacity:.4; font-size:10px; }
  thead th.sorted .ar { opacity:1; color:var(--violet); }
  th.num, td.num { text-align:right; font-family:var(--mono); }
  tbody tr { border-bottom:1px solid var(--stroke); transition:background .12s; }
  tbody tr:hover { background:var(--panel-2); }
  tbody tr.warn { background:rgba(255,180,84,.05); }
  td { padding:9px 12px; vertical-align:middle; }
  .modn { font-family:var(--mono); font-size:12.5px; color:var(--ink); }
  .modt { color:var(--ink-faint); font-size:11.5px; margin-top:2px; }
  .areatag { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }
  .docbar { width:64px; height:7px; border-radius:5px; background:rgba(140,160,220,.12); overflow:hidden; display:inline-block; vertical-align:middle; }
  .docbar > i { display:block; height:100%; background:var(--grad); }
  .sbadge { font-family:var(--mono); font-size:11px; color:var(--amber); font-weight:700; }
  .sok { color:var(--ink-faint); }
</style>
</head>
<body>
<main class="wrap">
  <section class="lead">
    <div class="eyebrow">Every source module · sortable &amp; searchable</div>
    <h1>Module Index</h1>
    <p>All 274 <code>.lean</code> files in the library. Click a column to sort; type to filter by
       module name or title; pick an area to narrow the field.</p>
  </section>

  <div class="toolbar">
    <input class="ipt" id="search" placeholder="filter modules…" autocomplete="off">
    <select class="ipt" id="areaSel"><option value="">all areas</option></select>
    <label class="areatag" style="cursor:pointer"><input type="checkbox" id="onlyWarn"> open proofs only</label>
    <span class="count" id="count"></span>
  </div>

  <div class="panel" style="overflow:hidden">
  <div style="overflow-x:auto">
    <table id="tbl">
      <thead><tr>
        <th data-k="module">Module <span class="ar">↕</span></th>
        <th data-k="area">Area <span class="ar">↕</span></th>
        <th data-k="lines" class="num">Lines <span class="ar">↕</span></th>
        <th data-k="decls" class="num">Decls <span class="ar">↕</span></th>
        <th data-k="theorems" class="num">Thms <span class="ar">↕</span></th>
        <th data-k="docpct" class="num">Docs <span class="ar">↕</span></th>
        <th data-k="sorries" class="num">Open <span class="ar">↕</span></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function(){
  mountChrome("files.html");

  const rows = S.files.map(f=>({
    ...f,
    docpct: f.doc_documentable ? Math.round(100*f.doc_documented/f.doc_documentable) : 100,
  }));

  // area select
  const areaSel=document.getElementById("areaSel");
  S.areas.forEach(a=> areaSel.appendChild(el("option",{value:a.name}, `${a.name} (${a.files})`)));

  let sortK="lines", sortDir=-1;
  const search=document.getElementById("search");
  const onlyWarn=document.getElementById("onlyWarn");

  function render(){
    const q=search.value.trim().toLowerCase();
    const area=areaSel.value;
    let list=rows.filter(r=>{
      if(area && r.area!==area) return false;
      if(onlyWarn.checked && r.sorries===0) return false;
      if(q && !(r.module.toLowerCase().includes(q) || (r.title||"").toLowerCase().includes(q))) return false;
      return true;
    });
    list.sort((a,b)=>{
      let va=a[sortK], vb=b[sortK];
      if(typeof va==="string"){ va=va.toLowerCase(); vb=vb.toLowerCase(); return va<vb?-sortDir:va>vb?sortDir:0; }
      return (va-vb)*sortDir;
    });
    const tb=document.getElementById("tbody");
    tb.innerHTML = list.map(r=>`
      <tr class="${r.sorries>0?'warn':''}">
        <td><div class="modn">${shortMod(r.module)}</div>${r.title?`<div class="modt">${r.title.replace(/</g,'&lt;')}</div>`:""}</td>
        <td><span class="areatag"><span class="dot" style="background:${areaColor(r.area)}"></span>${r.area}</span></td>
        <td class="num">${fmt(r.lines)}</td>
        <td class="num">${r.decls}</td>
        <td class="num">${r.theorems}</td>
        <td class="num"><span class="docbar" title="${r.docpct}%"><i style="width:${r.docpct}%"></i></span> <span style="color:var(--ink-faint)">${r.docpct}%</span></td>
        <td class="num">${r.sorries>0?`<span class="sbadge">${r.sorries} ⚠</span>`:`<span class="sok">—</span>`}</td>
      </tr>`).join("");
    document.getElementById("count").textContent = `${list.length} / ${rows.length} modules`;
    document.querySelectorAll("thead th").forEach(th=>{
      th.classList.toggle("sorted", th.dataset.k===sortK);
      const ar=th.querySelector(".ar"); if(ar) ar.textContent = th.dataset.k===sortK ? (sortDir>0?"↑":"↓") : "↕";
    });
  }

  document.querySelectorAll("thead th").forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      if(k===sortK) sortDir*=-1;
      else { sortK=k; sortDir = (k==="module"||k==="area") ? 1 : -1; }
      render();
    };
  });
  search.oninput=render; areaSel.onchange=render; onlyWarn.onchange=render;
  render();
  mountFooter();
})();
</script>
</body>
</html>
